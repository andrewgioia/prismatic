name: Deploy site

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: docker

    container:
      image: node:22-bookworm

    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git openssh-client rsync && rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install npm dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: install -d -m 700 "$HOME/.ssh" && printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519" && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts" && chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: rsync --archive --compress --delete --chmod=D755,F644 dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/prismatic.gioia.dev/" && rsync --archive --compress --chmod=F644 server/contact.php "$DEPLOY_USER@$DEPLOY_HOST:/var/www/api.gioia.dev/prismatic/contact.php"
